name: Manual APK

# 手动触发的「只打包 + 上传附件」工作流，用于真机验证：
# Actions → Manual APK → Run workflow → 选构建类型 → 下载 artifact 装到手机。
#
# 与另两个工作流的边界（刻意如此）：
# - 不是质量门禁：ci.yml 负责 push/PR 的 detekt/lint/test，release.yml 在发布时跑全套。
#   本工作流默认**不跑 gate**（只打包），需要时用 run_gate 打开。
# - 只在手动触发，不绑定 push/tag，避免空跑消耗 Actions 额度。
# - release 类型复用 release.yml 的同一套 Secrets（keystore + 密码），并顺带验证 R8 混淆。
# 参考：Float `.github/workflows/manual-apk.yml`（I:\dev\Float）。

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 构建类型（debug 可直接安装；release 需签名 Secrets，且能验证 R8 混淆）
        type: choice
        options:
          - debug
          - release
        default: debug
      run_gate:
        description: 打包前先跑质量门禁（ktfmtCheck + detekt + lint + 单测）
        type: boolean
        default: false

concurrency:
  group: manual-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # release 类型才需要签名；keystore 不入库，经 GitHub Secrets（base64）恢复
      - name: Decode release keystore
        if: inputs.build_type == 'release'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.keystore

      - name: Gate (ktfmt + detekt + lint + tests)
        if: inputs.run_gate
        run: ./gradlew ktfmtCheck detekt lintDebug testDebugUnitTest --continue

      - name: Assemble Debug
        if: inputs.build_type == 'debug'
        run: ./gradlew assembleDebug

      # 签名走 app/build.gradle.kts 的 env 回退（RELEASE_STORE_FILE 相对 app/ 解析），
      # 与 release.yml 保持一致
      - name: Assemble Release
        if: inputs.build_type == 'release'
        env:
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_FILE: ../release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      # 产物重命名带版本与短 SHA，并生成校验和，便于下载后核对
      - name: Collect artifact
        run: |
          mkdir -p dist
          version="$(grep -E '^VERSION_NAME=' gradle.properties | cut -d= -f2)"
          apk="$(ls app/build/outputs/apk/${{ inputs.build_type }}/*.apk | head -n1)"
          target="dist/camerasync-${version}-${{ inputs.build_type }}-$(git rev-parse --short HEAD).apk"
          cp "$apk" "$target"
          sha256sum "$target" > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: camerasync-apk-${{ inputs.build_type }}-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
